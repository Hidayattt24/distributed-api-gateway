name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Select release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test and package
        run: |
          chmod +x ./gradlew
          ./gradlew -PreleaseVersion=${{ steps.version.outputs.value }} check :gateway:gateway-runtime:distZip :control-plane:bootJar --no-daemon
      - name: Validate Compose
        run: docker compose config --quiet
        env:
          CONTROL_DATABASE_PASSWORD: ci-placeholder-database
          CONTROL_PLANE_TOKEN: ci-placeholder-token
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-grafana
      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t distributed-api-gateway:${{ github.sha }} .
      - name: Build control-plane image
        run: docker build -f Dockerfile.control-plane -t distributed-api-gateway-control-plane:${{ github.sha }} .
      - name: Generate checksums
        run: |
          sha256sum gateway/gateway-runtime/build/distributions/*.zip control-plane/build/libs/*.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ github.sha }}
          path: |
            gateway/gateway-runtime/build/distributions/*.zip
            control-plane/build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error
