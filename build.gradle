plugins {
    id 'base'
}

allprojects {
    group = 'dev.distributedgateway'
    version = providers.gradleProperty('releaseVersion').orElse('0.1.0').get()

    repositories {
        mavenCentral()
    }
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}
