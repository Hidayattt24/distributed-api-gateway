plugins {
    id 'application'
}

dependencies {
    implementation project(':gateway:gateway-core')
    implementation project(':gateway:gateway-ratelimit')
}

application {
    mainClass = 'dev.distributedgateway.runtime.GatewayApplication'
}

distributions {
    main {
        contents {
            from(rootProject.file('LICENSE'))
            from(rootProject.file('config/gateway.properties')) {
                into 'config'
            }
        }
    }
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}
