gateway.port=8080
gateway.response-timeout-seconds=5
routes=customers,visits,vets
route.customers.prefix=/owners
route.customers.upstream=http://localhost:8081
route.visits.prefix=/pets/visits
route.visits.upstream=http://localhost:8082
route.vets.prefix=/vets
route.vets.upstream=http://localhost:8083
rateLimit.customers.enabled=true
rateLimit.customers.capacity=10
rateLimit.customers.refillTokensPerSecond=5
rateLimit.visits.enabled=true
rateLimit.visits.capacity=10
rateLimit.visits.refillTokensPerSecond=5
rateLimit.vets.enabled=true
rateLimit.vets.capacity=10
rateLimit.vets.refillTokensPerSecond=5

# Distributed rate limiting. If empty or omitted, gateway uses local in-memory token bucket.
# redis.url=redis://localhost:6379

# Key types: ROUTE, API_KEY, CLIENT_IP (default: ROUTE)
# API_KEY requires RATE_LIMIT_<ROUTE_ID>_API_KEY_SHA256 with comma-separated SHA-256 hashes.
# Unverified or missing API keys receive HTTP 401. CLIENT_IP uses the direct peer IP, not forwarded headers.
# Redis failure modes: LOCAL_FALLBACK, FAIL_OPEN, FAIL_CLOSED (default: LOCAL_FALLBACK)
rateLimit.customers.keyType=ROUTE
rateLimit.customers.failureMode=LOCAL_FALLBACK
