services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8888"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    depends_on:
      config-server:
        condition: service_healthy

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_started

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${CONTROL_DATABASE_PASSWORD:?Set CONTROL_DATABASE_PASSWORD in .env}
    volumes:
      - control-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    environment:
      CONTROL_DATABASE_URL: jdbc:postgresql://postgres:5432/gateway
      CONTROL_DATABASE_USER: gateway
      CONTROL_DATABASE_PASSWORD: ${CONTROL_DATABASE_PASSWORD:?Set CONTROL_DATABASE_PASSWORD in .env}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?Set CONTROL_PLANE_TOKEN in .env}
      CONTROL_SEED_FILE: config/gateway.properties
      CUSTOMERS_SERVICE_URL: http://customers-service:8081
      VISITS_SERVICE_URL: http://visits-service:8082
      VETS_SERVICE_URL: http://vets-service:8083
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      CUSTOMERS_SERVICE_URL: http://customers-service:8081
      VISITS_SERVICE_URL: http://visits-service:8082
      VETS_SERVICE_URL: http://vets-service:8083
      REDIS_URL: redis://redis:6379
      CONTROL_PLANE_URL: http://control-plane:9090/internal/config/active
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?Set CONTROL_PLANE_TOKEN in .env}
      CONTROL_PLANE_POLL_SECONDS: "2"
      GATEWAY_MANAGEMENT_HOST: 0.0.0.0
    ports:
      - "8080:8080"
      - "127.0.0.1:9092:9092"
    depends_on:
      - customers-service
      - visits-service
      - vets-service
      - redis
      - control-plane

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  control-db:
